[project]
name = "fastapi-auth-api"
version = "0.1.0"
description = "Reusable authentication service with JWT, refresh tokens, RBAC, and password recovery"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Diego (dblzroch)" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0",
    "greenlet>=3.0,<4.0",
    "aiosqlite>=0.19,<0.20",
    "email-validator>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.26,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "coverage[toml]>=7.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["authapi"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["authapi"]

[tool.ruff.lint]
ignore = ["B008", "UP040"]
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=authapi --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
strict = true
